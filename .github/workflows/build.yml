name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        integrations: [none, ae2, mekanism, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: bash gradlew build
      - name: Python tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: In-game tests
        run: bash gradlew runGameTestServer -PintegrationProfile=${{ matrix.integrations }}
      - name: Save reopening with VoxelScope removed
        if: matrix.integrations == 'all'
        run: bash gradlew runGameTestServer -PpackIntegrations=true -PwithoutBridge=true
      - name: Package preview artifacts
        if: matrix.integrations == 'all'
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.integrations == 'all'
        with:
          name: voxelscope-preview
          path: dist/*
